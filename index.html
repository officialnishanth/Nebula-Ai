<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Nebula AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    padding:15px;
    text-align:center;
    background:#1e293b;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #334155;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
}

.message{
    max-width:80%;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    word-wrap:break-word;
    white-space:pre-wrap;
}

.user{
    background:#2563eb;
    align-self:flex-end;
}

.bot{
    background:#334155;
    align-self:flex-start;
}

.input-area{
    display:flex;
    gap:10px;
    padding:10px;
    background:#1e293b;
    border-top:1px solid #334155;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

button{
    padding:12px 20px;
    background:#2563eb;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<header>🌌 Nebula AI</header>

<div id="chat">
    <div class="message bot">
        Hello! I'm Nebula AI. How can I help you today?
    </div>
</div>

<div class="input-area">
    <input
        type="text"
        id="prompt"
        placeholder="Ask anything..."
        onkeypress="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">Send</button>
</div>

<script>

// Paste your Gemini API key here
const API_KEY ="AQ.Ab8RN6Ksf58NGbqB0NhCkvP3895hp6elbZE22E4DjBuzXsB4ow";

function addMessage(text, type){
    const div = document.createElement("div");
    div.className = `message ${type}`;
    div.textContent = text;

    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){

    const input = document.getElementById("prompt");
    const text = input.value.trim();

    if(!text) return;

    addMessage(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message bot";
    loading.id = "loading";
    loading.textContent = "Thinking...";
    document.getElementById("chat").appendChild(loading);

    try{

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    contents:[
                        {
                            parts:[
                                {
                                    text:text
                                }
                            ]
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        document.getElementById("loading")?.remove();

        if(data.candidates){
    const reply = data.candidates[0].content.parts[0].text;
    addMessage(reply, "bot");
}
else{
    addMessage(
        JSON.stringify(data, null, 2),
        "bot"
    );
}

    }catch(error){

        document.getElementById("loading")?.remove();

        console.error(error);

        addMessage(
            "Failed to connect to Gemini API.",
            "bot"
        );
    }
}

</script>

</body>
</html>
