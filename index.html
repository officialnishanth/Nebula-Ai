
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
padding:15px;
text-align:center;
background:#1e293b;
font-size:22px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.message{
max-width:80%;
padding:12px;
margin:10px 0;
border-radius:12px;
}

.user{
background:#2563eb;
margin-left:auto;
}

.bot{
background:#334155;
}

.input-area{
display:flex;
padding:10px;
background:#1e293b;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
outline:none;
}

button{
margin-left:10px;
padding:12px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<header>Nishant AI</header>

<div id="chat"></div>

<div class="input-area">
<input type="text" id="prompt" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>

<script>

const API_KEY = "AQ.Ab8RN6K0qGDMFuVlZI2X-F6c5QIzYdIBFD0UpoIMMxTUHGEaeQ";

function addMessage(text,type){
const div=document.createElement("div");
div.className=message ${type}`;
div.textContent=text;
document.getElementById("chat").appendChild(div);
document.getElementById("chat").scrollTop=
document.getElementById("chat").scrollHeight;
}

async function sendMessage(){

const input=document.getElementById("prompt");
const text=input.value.trim();

if(!text) return;

addMessage(text,"user");
input.value="";

try{

const response=await fetch(
https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:text
}
]
}
]
})
}
);

const data=await response.json();

const reply=
data.candidates[0].content.parts[0].text;

addMessage(reply,"bot");

}catch(err){
addMessage("Error connecting to AI","bot");
console.error(err);
}
}
</script>

</body>
</html>
